{% extends "base.html" %}

{% block title %} {{ title }} {% endblock %}

{% block header %}
        <h1 class="display-4 fw-normal">{{ title }}</h1>
        <p class="fs-5 text-muted">{{ text }}</p>
        <a href="/api/new">Создать новую задачу</a>
{% endblock %}

{% block content %}
    {% for job in to_do_list %}
      <div class="col">
        <div class="card mb-4 rounded-3 shadow-sm">
          <div class="card-header py-3">
            <h4 class="my-0 fw-normal"><a href="/api/item/{{ job.job_id }}">{{ job.title }}</a></h4>
          </div>
          <div class="card-body">
            <h1 class="card-title pricing-card-title">{{ job.due_date }}<small class="text-muted fw-light"></small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li>{{ job.description }}</li>
            </ul>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault" {% if job.completed %} checked {% endif %}>
                <label class="form-check-label" for="flexSwitchCheckDefault">Default switch checkbox input</label>
            </div>
          </div>
        </div>
      </div>
     {% endfor %}
{% endblock %}
