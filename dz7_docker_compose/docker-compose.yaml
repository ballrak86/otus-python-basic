services:
  app:
    build:
      context: .
      dockerfile: ./job-app/Dockerfile
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    environment:
      JOB_APP__DB__SQLA__ECHO: 0
      JOB_APP__DB__PG__HOST: pg
      JOB_APP__DB__PG__PORT: 5432
      JOB_APP__DB__PG__DB: ${PG_DB}
      JOB_APP__DB__PG__USER: ${PG_USER}
      JOB_APP__DB__PG__PASSWORD: ${PG_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      pg:
        condition: service_healthy

  pg:
    image: postgres:18
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      PGDATA: /var/lib/postgresql/18/jobs
    volumes:
      - pg_data:/var/lib/postgresql/18/jobs
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 2s
      retries: 3

volumes:
  pg_data: